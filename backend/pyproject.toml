[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-study"
version = "0.1.0"
description = "Multi-agent study planner with grounded RAG tutoring."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "pyjwt>=2.8",
  "apscheduler>=3.10",
  "jinja2>=3.1",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
