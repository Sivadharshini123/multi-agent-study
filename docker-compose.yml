services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://study:study@db:5432/study
      JWT_SECRET: change-me-in-production
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      SCHEDULER_ENABLED: "1"
      ALLOW_TEACHER_SIGNUP: "1"
      CORS_ORIGINS: http://localhost:3000
      SUBJECTS_CONFIG: /srv/config/subjects.yaml
      MATERIALS_ROOT: /srv/materials
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./materials:/srv/materials
      - ./config:/srv/config

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
